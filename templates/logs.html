<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日志</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">最新日志 (最多 500 行)</h3>
            <a class="btn btn-outline-secondary" href="/">返回</a>
        </div>
        <div class="card">
            <div class="card-body" style="max-height: 70vh; overflow:auto; font-family: monospace; background: #0b132b; color:#d4f1f4;">
                {% for line in lines %}
                    <div>{{ line }}</div>
                {% else %}
                    <div class="text-muted">暂无日志</div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
